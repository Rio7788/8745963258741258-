<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14532D">
<title>Sunny Sip Juice Bar | Contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="css/style.css"></head>
<body>
<header id="top"></header>
<main>
<section><div class="wrap"><h2>Say hi</h2><p class="sub">Ask about today’s flavours, prices or large orders.</p>
<div class="info">
<div><p><b>Shop address</b><br><span data-shop="addr"></span></p><p><b>Opening hours</b><br><span data-shop="hours"></span></p><p><b>Phone / WhatsApp</b><br><span data-shop="phone"></span></p><a class="btn" data-wa href="#" target="_blank" rel="noopener">Message on WhatsApp</a></div>
<form id="cform"><label for="nm">Your name</label><input id="nm" required autocomplete="name"><label for="msg">Message</label><textarea id="msg" rows="4" required></textarea><button class="btn alt" type="submit">Send via WhatsApp</button></form>
</div></div></section>
</main>
<footer id="foot"></footer>
<script src="js/app.js"></script>
</body></html>
