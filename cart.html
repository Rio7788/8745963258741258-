<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174c37"><title>Your Cart | THARU Juice Bar</title><link rel="icon" type="image/png" href="images/logo001.png"><link rel="stylesheet" href="styles.css"></head>
<body><div id="site-header"></div><main class="page-main">
<section class="page-intro compact"><span class="eyebrow" data-i18n="almostThere">ALMOST THERE</span><h1 data-i18n="cartTitle">Your little order.</h1><p data-i18n="cartSubtitle">Check your picks, then send your order to us on WhatsApp.</p></section>
<div class="checkout-layout"><section class="glass cart-panel"><div class="panel-heading"><h2 data-i18n="yourCart">Your cart</h2><button class="btn btn-soft btn-small" id="clear-cart" data-i18n="clearCart">Clear cart</button></div><div id="cart-items"></div><div class="cart-total"><span data-i18n="total">Total</span><strong id="cart-total">LKR 0</strong></div></section>
<section class="glass form-panel"><h2 data-i18n="customerDetails">Your details</h2><form id="checkout-form">
<label><span data-i18n="fullName">Full name *</span><input name="name" required autocomplete="name" maxlength="90" placeholder="Your name"></label>
<label><span data-i18n="phone">Phone number *</span><input name="phone" required autocomplete="tel" inputmode="tel" pattern="[+0-9 ()-]{7,20}" placeholder="07X XXX XXXX"></label>
<label><span data-i18n="address">Delivery address *</span><textarea name="address" required rows="2" maxlength="350" placeholder="House number, street, town"></textarea></label>
<label><span data-i18n="notes">Notes (optional)</span><textarea name="notes" rows="2" maxlength="500" placeholder="Anything we should know?"></textarea></label>
<p class="form-hint" data-i18n="whatsappHint">Your order opens in WhatsApp so you can review and send it to our team.</p><button class="btn btn-primary btn-wide" type="submit" id="whatsapp-order">Send order on WhatsApp ↗</button><p class="form-error" id="checkout-error" role="alert"></p>
</form></section></div></main><div id="site-footer"></div><script type="module" src="app.js"></script></body></html>
