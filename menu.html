<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174c37"><title>Menu & Order | THARU Juice Bar</title><link rel="icon" type="image/png" href="images/logo001.png"><link rel="stylesheet" href="styles.css"></head>
<body><div id="site-header"></div><main class="page-main">
<section class="page-intro"><span class="eyebrow" data-i18n="ourMenu">THE GOOD STUFF</span><h1 data-i18n="menuTitle">Fresh picks, happy sips.</h1><p data-i18n="menuSubtitle">Find your favorite juice, smoothie, snack or bakery treat.</p></section>
<div class="menu-toolbar"><div id="category-filters" class="filter-row" aria-label="Filter menu"></div><label class="search-pill"><span aria-hidden="true">⌕</span><input id="menu-search" type="search" placeholder="Search the menu…" data-i18n-placeholder="searchPlaceholder" aria-label="Search menu"></label></div>
<div id="shop-announcement" class="announcement glass hidden"></div><div id="shop-closed" class="closed-notice hidden glass" data-i18n="shopClosed">We’re currently closed. You can browse the menu, but ordering may be delayed.</div>
<div id="menu-status" class="status-line" aria-live="polite">Loading menu…</div><section id="menu-grid" class="menu-grid" aria-live="polite"></section>
</main><div id="site-footer"></div><script type="module" src="app.js"></script></body></html>
